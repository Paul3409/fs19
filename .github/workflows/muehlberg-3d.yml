name: Dorffeuerwache Muehlberg 3D Download
on:
  push:
    paths:
      - 'Dorffeuerwache_Muehlberg/**'
      - '.github/workflows/muehlberg-3d.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies
        run: python -m pip install numpy pillow trimesh scipy
      - name: Generate GLB, OBJ and PNG textures
        run: python Dorffeuerwache_Muehlberg/Muehlberg_3D_Generator.py
      - name: Publish downloadable model package
        uses: actions/upload-artifact@v4
        with:
          name: Dorffeuerwache_Muehlberg_3D_mit_Texturen
          path: Dorffeuerwache_Muehlberg_Nach_Zeichnung_3D.zip
          if-no-files-found: error
          retention-days: 90
